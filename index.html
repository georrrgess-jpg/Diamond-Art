<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f6f1e8">
<title>Lustra Gem Mosaics</title>
<meta name="description" content="A calm gem-by-number game. Place faceted gemstones into numbered sockets to complete geometric mandalas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 12 16 29 4 12Z' fill='%232f6fe0'/%3E%3Cpath d='M4 12h24L16 3Z' fill='%238fc6f2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- ============ GALLERY ============ -->
  <section id="gallery" class="screen" aria-label="Gallery">
    <header class="g-head">
      <div class="brand">
        <svg class="brand-gem" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M20 3 35 14 20 37 5 14Z" fill="#2f6fe0"/><path d="M5 14h30L20 3Z" fill="#8fc6f2"/>
          <path d="M12 14 20 3l8 11Z" fill="#d6e9fb"/><path d="M12 14h16l-8 23Z" fill="#1d4fb8"/>
          <path d="M20 3 35 14 20 37 5 14Z" fill="none" stroke="#173f8f" stroke-width="1"/>
        </svg>
        <div>
          <h1 class="wordmark">Lustra</h1>
          <p class="tagline">Gem mosaics, one facet at a time</p>
        </div>
      </div>
    </header>
    <section id="continue" class="continue" hidden></section>
    <div class="filters" role="toolbar" aria-label="Filters">
      <div class="chips" data-group="cat" role="group" aria-label="Type">
        <button class="chip" data-v="all" aria-pressed="true">All</button>
        <button class="chip" data-v="mandala" aria-pressed="false">Mandalas</button>
        <button class="chip" data-v="geometric" aria-pressed="false">Geometric</button>
      </div>
      <div class="chips" data-group="diff" role="group" aria-label="Difficulty">
        <button class="chip" data-v="all" aria-pressed="true">Any level</button>
        <button class="chip" data-v="Beginner" aria-pressed="false">Beginner</button>
        <button class="chip" data-v="Medium" aria-pressed="false">Medium</button>
        <button class="chip" data-v="Intricate" aria-pressed="false">Intricate</button>
        <button class="chip" data-v="Expert" aria-pressed="false">Expert</button>
      </div>
      <div class="chips" data-group="status" role="group" aria-label="Progress">
        <button class="chip" data-v="all" aria-pressed="true">Everything</button>
        <button class="chip" data-v="new" aria-pressed="false">Not started</button>
        <button class="chip" data-v="progress" aria-pressed="false">In progress</button>
        <button class="chip" data-v="done" aria-pressed="false">Completed</button>
        <button class="chip" data-v="fav" aria-pressed="false">Favorites</button>
      </div>
    </div>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>No artworks match these filters.</p>
  </section>

  <!-- ============ PLAY ============ -->
  <section id="play" class="screen" aria-label="Artwork" hidden>
    <header class="p-top">
      <button class="icon-btn" id="btn-back" aria-label="Back to gallery"></button>
      <div class="p-title">
        <h2 id="art-name"></h2>
        <div class="p-prog"><div class="bar"><i id="prog-fill"></i></div><span id="prog-txt">0%</span></div>
      </div>
      <button class="icon-btn" id="btn-menu" aria-label="Settings and options" aria-haspopup="true" aria-expanded="false"></button>
    </header>
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="Artwork canvas. Select a numbered gem below, then tap matching numbered sockets."></canvas>
      <div class="tools" role="toolbar" aria-label="Canvas tools">
        <button class="tool" id="t-mode" aria-label="Pan mode" aria-pressed="false"></button>
        <button class="tool" id="t-zin" aria-label="Zoom in"></button>
        <button class="tool" id="t-zout" aria-label="Zoom out"></button>
        <button class="tool" id="t-fit" aria-label="Fit artwork"></button>
        <button class="tool" id="t-hint" aria-label="Hint: show a remaining socket"></button>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <footer class="palette-bar">
      <div id="palette" class="palette" role="radiogroup" aria-label="Gem palette"></div>
    </footer>
    <div id="menu" class="menu" hidden role="menu">
      <label class="row"><span>Sound</span><input type="checkbox" id="opt-sound" class="switch"></label>
      <label class="row"><span>Auto-advance to next gem</span><input type="checkbox" id="opt-auto" class="switch"></label>
      <label class="row"><span>Reduce motion</span><input type="checkbox" id="opt-motion" class="switch"></label>
      <hr>
      <button class="row btn-row" id="m-export">Save image (PNG)</button>
      <button class="row btn-row danger" id="m-restart">Restart this artwork…</button>
    </div>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
